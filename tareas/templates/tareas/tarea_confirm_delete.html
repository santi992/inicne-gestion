{% extends "base.html" %}
{% block titulo %}Eliminar tarea{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger"><div class="card-body">
      <h1 class="h4">Eliminar tarea</h1>
      <p>¿Seguro que querés eliminar <strong>{{ object.titulo }}</strong> (asignada a {{ object.responsable }})?</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a class="btn btn-link" href="{% url 'tablero' %}">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
