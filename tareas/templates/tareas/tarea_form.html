{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">{{ titulo }}</h1>
    <div class="card"><div class="card-body">
      <form method="post">
        {% csrf_token %}
        {# Reutilizo la misma plantilla de campos que en equipamiento #}
        {% include "_campos_formulario.html" %}
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-link" href="{% url 'tablero' %}">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
